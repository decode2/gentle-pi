name: Windows transport feasibility

on:
  push:
    branches:
      - test/windows-transport-feasibility

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Run Windows PowerShell 5.1 startup control
        shell: cmd
        run: node tests/windows-transport-feasibility/probe.mjs --startup-control

      - name: Run Windows PowerShell 5.1 named-pipe feasibility probe
        if: success()
        shell: cmd
        run: node tests/windows-transport-feasibility/probe.mjs
