name: Questionnaire UX validation

on:
  push:
    branches:
      - test/questionnaire-visual-polish-5594c1f4

permissions:
  contents: read

jobs:
  focused-tests:
    if: github.repository == 'decode2/gentle-pi'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify revision and log runtime
        shell: bash
        run: |
          head_sha="$(git rev-parse HEAD)"
          printf 'github.sha=%s\nhead=%s\nos=%s\nnode=%s\npnpm=%s\n' "$GITHUB_SHA" "$head_sha" "$RUNNER_OS" "$(node --version)" "$(pnpm --version)"
          test "$head_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run focused questionnaire tests
        run: pnpm exec node --experimental-strip-types --experimental-test-module-mocks --test tests/ask-user-question.test.ts tests/question-option-control.test.ts tests/question-presentation-state.test.ts tests/question-tui-presentation-view.test.ts tests/questions-contract.test.ts tests/question-tui-viewport.test.ts tests/question-external-editor-wiring.test.ts tests/ask-user-choice.test.ts tests/tui-presentation-driver.test.ts tests/rpc-presentation-driver.test.ts

  scoped-strict-typescript:
    name: SCOPED strict TypeScript (${{ matrix.target }})
    if: github.repository == 'decode2/gentle-pi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: candidate
            expected_sha: ${{ github.sha }}
    env:
      TARGET: ${{ matrix.target }}
      EXPECTED_SHA: ${{ matrix.expected_sha }}
    steps:
      - name: Checkout exact ${{ matrix.target }} revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.expected_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify revision and log runtime
        shell: bash
        run: |
          head_sha="$(git rev-parse HEAD)"
          printf 'target=%s\ngithub.sha=%s\nexpected_sha=%s\nhead=%s\nos=%s\nnode=%s\npnpm=%s\n' "$TARGET" "$GITHUB_SHA" "$EXPECTED_SHA" "$head_sha" "$RUNNER_OS" "$(node --version)" "$(pnpm --version)"
          test "$head_sha" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install pinned CI-only TypeScript tools
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/questionnaire-typecheck-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund typescript@5.9.3 @types/node@24.13.3
          printf 'target=%s compiler=' "$TARGET"
          node "$RUNNER_TEMP/questionnaire-typecheck-tools/node_modules/typescript/bin/tsc" --version

      - name: Run SCOPED strict TypeScript
        shell: bash
        run: |
          node "$RUNNER_TEMP/questionnaire-typecheck-tools/node_modules/typescript/bin/tsc" \
            --noEmit \
            --strict \
            --skipLibCheck \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --allowImportingTsExtensions \
            --typeRoots "$RUNNER_TEMP/questionnaire-typecheck-tools/node_modules/@types" \
            --types node \
            extensions/ask-user-question.ts \
            lib/questions/option-control.ts \
            lib/questions/rpc-presentation-driver.ts \
            lib/questions/tui-presentation-driver.ts \
            lib/questions/tui-presentation-view.ts \
            tests/ask-user-question.test.ts \
            tests/question-option-control.test.ts \
            tests/question-presentation-state.test.ts \
            tests/question-tui-presentation-view.test.ts \
            tests/questions-contract.test.ts \
            tests/question-tui-viewport.test.ts \
            tests/question-external-editor-wiring.test.ts \
            tests/ask-user-choice.test.ts \
            tests/tui-presentation-driver.test.ts \
            tests/rpc-presentation-driver.test.ts \
            tests/hosted-ask-user-question-rpc.test.ts \
            tests/hosted-questionnaire-main-acquisition.test.ts \
            tests/fixtures/hosted-synthetic-provider.ts

  hosted-rpc-cancellation:
    name: Hosted RPC cancellation (isolated Docker)
    if: github.repository == 'decode2/gentle-pi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify clean exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Record hosted runtime provenance
        shell: bash
        run: |
          set -euo pipefail
          pi_entry="$(node --input-type=module -e 'import { fileURLToPath } from "node:url"; console.log(fileURLToPath(import.meta.resolve("@earendil-works/pi-coding-agent")))')"
          pi_root="$(dirname "$(dirname "$pi_entry")")"
          pi_metadata="$(node -e 'const fs=require("node:fs"), path=require("node:path"); const p=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const bin=typeof p.bin==="string" ? p.bin : p.bin?.pi; const cli=typeof bin==="string" ? path.resolve(process.argv[2], bin) : ""; if (p.name!=="@earendil-works/pi-coding-agent" || p.version!=="0.85.1" || typeof bin!=="string" || !fs.statSync(cli).isFile()) throw new Error("invalid hosted Pi package metadata"); console.log(JSON.stringify({name:p.name, version:p.version, bin:p.bin, cli}));' "$pi_root/package.json" "$pi_root")"
          pi_version="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).version)' "$pi_root/package.json")"
          test "$pi_version" = "0.85.1"
          printf 'head=%s\nlock_sha256=%s\nnode=%s\npnpm=%s\npi_entry=%s\npi_metadata=%s\n' \
            "$(git rev-parse HEAD)" "$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)" "$(node --version)" "$(pnpm --version)" "$pi_entry" "$pi_metadata"

      - name: Pull and pin Node 24 candidate image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null
          docker info >/dev/null
          docker pull node:24-bookworm-slim
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' node:24-bookworm-slim)"
          image_id="$(docker image inspect --format '{{.Id}}' node:24-bookworm-slim)"
          case "$image_ref" in node@sha256:*) ;; *) echo "missing immutable image digest" >&2; exit 1;; esac
          test -n "$image_id"
          printf 'image_ref=%s\nimage_id=%s\n' "$image_ref" "$image_id"
          printf 'ref=%s\nid=%s\n' "$image_ref" "$image_id" >> "$GITHUB_OUTPUT"

      - name: Verify Docker isolation readback
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" = "$IMAGE_ID"
          docker run --rm --network=none --read-only \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=1g --pids-limit=256 --cap-drop=ALL \
            --security-opt=no-new-privileges --user 1000:1000 "$IMAGE_REF" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/local/bin/node --input-type=module -e 'import { readFileSync } from "node:fs"; import { networkInterfaces } from "node:os"; const mounts = readFileSync("/proc/self/mountinfo", "utf8").split(String.fromCharCode(10)).map((line) => line.split(" - ")[0]?.split(" ")).filter(Boolean); const opts = (point) => mounts.find((fields) => fields[4] === point)?.[5]?.split(",") ?? []; const status = readFileSync("/proc/self/status", "utf8").split(String.fromCharCode(10)); const noNewPrivs = status.some((line) => line.startsWith("NoNewPrivs:") && line.trim().endsWith("1")); const capsDropped = status.some((line) => line.startsWith("CapEff:") && [...(line.split(":")[1]?.trim() ?? "")].every((char) => char === "0")); if (!opts("/").includes("ro") || !opts("/workspace").includes("ro") || process.getuid() !== 1000 || !noNewPrivs || !capsDropped || Object.keys(networkInterfaces()).some((name) => name !== "lo")) throw new Error("Docker isolation readback failed"); console.log(`uid=${process.getuid()} node=${process.version} network=none rootfs=ro checkout=ro caps=0 no_new_privs=1`);'

      - name: Acquire pinned public rpiv sources in isolated container
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" = "$IMAGE_ID"
          reference_dir="$RUNNER_TEMP/hosted-rpiv-reference"
          test ! -e "$reference_dir"
          mkdir "$reference_dir"
          chmod 0777 "$reference_dir"
          docker run --rm -i --network=bridge --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$reference_dir,target=/artifact" \
            --user 1000:1000 "$IMAGE_REF" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/artifact TMPDIR=/artifact \
            /usr/local/bin/node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { mkdir, readFile, readlink, symlink } from "node:fs/promises";
          import { dirname, join } from "node:path";
          import { gunzipSync } from "node:zlib";

          const manifestPath = "/workspace/.github/workflows/fixtures/hosted-rpiv-ask-user-question-2.9.0.json";
          const manifest = JSON.parse(await readFile(manifestPath, "utf8"));
          const fail = (condition, message) => { if (!condition) throw new Error(message); };
          fail(manifest.schema === "gentle-pi.hosted-rpiv-reference/v1", "invalid hosted rpiv manifest schema");
          fail(Array.isArray(manifest.packages) && manifest.packages.length === 2, "hosted rpiv manifest must pin two packages");
          fail(Array.isArray(manifest.links) && manifest.links.length === 5, "hosted rpiv manifest must pin five dependency links");
          const packages = manifest.packages;
          const links = manifest.links;
          const byName = new Map();
          for (const spec of packages) {
            fail(typeof spec.name === "string" && !byName.has(spec.name), "invalid or duplicate hosted package name");
            byName.set(spec.name, spec);
            fail(spec.archiveRoot === "package/", `${spec.name}: unexpected archive root`);
            fail(typeof spec.extractPath === "string" && spec.extractPath.startsWith("node_modules/") && !spec.extractPath.includes("\\") && spec.extractPath.split("/").every((part) => part.length > 0 && part !== "." && part !== ".."), `${spec.name}: invalid extraction path`);
            fail(typeof spec.entry === "string" && !spec.entry.includes("..") && !spec.entry.includes("\\") && !spec.entry.startsWith("/"), `${spec.name}: invalid public entry`);
          }
          const decoder = new TextDecoder();
          const headerText = (bytes, start, length) => {
            const text = decoder.decode(bytes.subarray(start, start + length));
            const nul = text.indexOf("\0");
            return nul < 0 ? text : text.slice(0, nul);
          };
          const octal = (bytes, start, length) => {
            const value = headerText(bytes, start, length).trim();
            const number = Number.parseInt(value || "0", 8);
            fail(Number.isSafeInteger(number) && number >= 0, "invalid tar size");
            return number;
          };
          const safeArchivePath = (name) => {
            fail(name === "package" || name === "package/" || name.startsWith("package/"), `unsafe archive path: ${name}`);
            fail(!name.startsWith("/") && !name.includes("\\") && !name.includes("\0"), `unsafe archive path: ${name}`);
            const parts = name.split("/");
            if (parts.at(-1) === "") parts.pop();
            fail(parts.every((part) => part.length > 0 && part !== "." && part !== ".."), `unsafe archive path: ${name}`);
          };
          const paxPath = (data) => {
            let cursor = 0; let path;
            while (cursor < data.length) {
              const space = data.indexOf(0x20, cursor);
              const length = Number.parseInt(decoder.decode(data.subarray(cursor, space)), 10);
              fail(space > cursor && Number.isSafeInteger(length) && length > 0 && cursor + length <= data.length, "invalid pax record");
              const record = decoder.decode(data.subarray(space + 1, cursor + length - 1));
              if (record.startsWith("path=")) path = record.slice(5);
              cursor += length;
            }
            return path;
          };
          const archiveEntries = (bytes) => {
            const tar = gunzipSync(bytes);
            const names = new Set(); let offset = 0; let override;
            while (offset + 512 <= tar.length) {
              const header = tar.subarray(offset, offset + 512);
              if (header.every((byte) => byte === 0)) break;
              const size = octal(header, 124, 12);
              const end = offset + 512 + Math.ceil(size / 512) * 512;
              fail(end <= tar.length, "truncated tar archive");
              const type = header[156] === 0 ? "0" : String.fromCharCode(header[156]);
              const data = tar.subarray(offset + 512, offset + 512 + size);
              if (type === "x") { override = paxPath(data); } else {
                fail(type === "0" || type === "5", `unsafe tar entry type: ${type}`);
                const name = override ?? [headerText(header, 345, 155), headerText(header, 0, 100)].filter(Boolean).join("/");
                override = undefined; safeArchivePath(name); names.add(name);
              }
              offset = end;
            }
            return names;
          };
          const map = (value) => Object.fromEntries(Object.entries(value ?? {}).sort(([left], [right]) => left.localeCompare(right)));
          const sameMap = (actual, expected, label) => fail(JSON.stringify(map(actual)) === JSON.stringify(map(expected)), `${label}: dependency metadata changed`);
          const relativePath = (value, label) => { fail(typeof value === "string" && value.length > 0 && !value.startsWith("/") && !value.includes("\\") && value.split("/").every((part) => part.length > 0 && part !== "." && part !== ".."), `${label}: unsafe relative path`); };
          const directLink = (owner, packageName) => links.find((link) => link.package === packageName && link.path.startsWith(`${owner.extractPath}/node_modules/`));

          for (const spec of packages) {
            const response = await fetch(spec.url, { redirect: "error" });
            fail(response.ok, `${spec.name}: registry returned HTTP ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
            fail(integrity === spec.integrity, `${spec.name}: SRI mismatch`);
            const entries = archiveEntries(bytes);
            const entryPath = `${spec.archiveRoot}${spec.entry}`;
            fail(entries.has(entryPath) && entries.has(`${spec.archiveRoot}package.json`), `${spec.name}: required archive files missing`);
            const metadata = JSON.parse(execFileSync("tar", ["--extract", "--to-stdout", "--gzip", "--file=-", `${spec.archiveRoot}package.json`], { input: bytes }).toString("utf8"));
            fail(metadata.name === spec.name && metadata.version === spec.version && metadata.license === spec.license && metadata.type === "module", `${spec.name}: package metadata changed`);
            fail(metadata.exports?.["."] === `./${spec.entry}`, `${spec.name}: public export changed`);
            sameMap(metadata.dependencies, spec.dependencies, `${spec.name} dependencies`);
            sameMap(metadata.peerDependencies, spec.peerDependencies, `${spec.name} peers`);
            const optionalPeers = new Set(spec.optionalPeers ?? []);
            for (const peer of Object.keys(spec.peerDependencies ?? {})) fail((metadata.peerDependenciesMeta?.[peer]?.optional === true) === optionalPeers.has(peer), `${spec.name}: optional peer metadata changed`);
            for (const dependency of Object.keys(spec.dependencies ?? {})) fail(byName.has(dependency) || directLink(spec, dependency), `${spec.name}: unresolved dependency ${dependency}`);
            for (const peer of Object.keys(spec.peerDependencies ?? {})) if (!optionalPeers.has(peer)) fail(directLink(spec, peer), `${spec.name}: unresolved peer ${peer}`);
            const destination = join("/artifact", spec.extractPath); await mkdir(destination, { recursive: true });
            execFileSync("tar", ["--extract", "--gzip", "--file=-", "--directory", destination, "--strip-components=1", "--no-same-owner", "--no-same-permissions", "--no-overwrite-dir", "--delay-directory-restore"], { input: bytes, stdio: ["pipe", "ignore", "inherit"] });
          }
          const targetPath = (target) => {
            if (target.startsWith("/reference/")) return join("/artifact", target.slice("/reference/".length));
            if (target.startsWith("/workspace/")) return target;
            throw new Error(`unapproved dependency target: ${target}`);
          };
          for (const link of links) {
            relativePath(link.path, "link path"); relativePath(link.package, "link package");
            fail(link.target === `/reference/node_modules/${link.package}` || link.target === `/workspace/node_modules/${link.package}`, `${link.package}: unexpected link target`);
            const target = targetPath(link.target); const metadata = JSON.parse(await readFile(join(target, "package.json"), "utf8"));
            fail(metadata.name === link.package && metadata.version === link.version, `${link.package}: linked package metadata changed`);
            const linkPath = join("/artifact", link.path); await mkdir(dirname(linkPath), { recursive: true });
            await symlink(link.target, linkPath); fail(await readlink(linkPath) === link.target, `${link.package}: link readback failed`);
          }
          console.log(`acquired=${packages.map((spec) => `${spec.name}@${spec.version}`).join(",")} links=${links.length} source=registry SRI=verified scripts=none`);
          NODE
          test -r "$reference_dir/node_modules/@juicesharp/rpiv-ask-user-question/index.ts"
          test -r "$reference_dir/node_modules/@juicesharp/rpiv-config/index.ts"
          test "$(readlink "$reference_dir/node_modules/@juicesharp/rpiv-ask-user-question/node_modules/typebox")" = "/workspace/node_modules/typebox"
          test "$(readlink "$reference_dir/node_modules/@juicesharp/rpiv-config/node_modules/typebox")" = "/workspace/node_modules/typebox"

      - name: Run hosted RPC cancellation in isolated container
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" = "$IMAGE_ID"
          reference_dir="$RUNNER_TEMP/hosted-rpiv-reference"
          test -r "$reference_dir/node_modules/@juicesharp/rpiv-ask-user-question/index.ts"
          docker run --rm --network=none --read-only \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$reference_dir,target=/reference,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=1g --pids-limit=256 --cap-drop=ALL \
            --security-opt=no-new-privileges --user 1000:1000 -w /workspace "$IMAGE_REF" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/tmp/hosted-home USERPROFILE=/tmp/hosted-userprofile \
            XDG_CONFIG_HOME=/tmp/hosted-xdg-config XDG_CACHE_HOME=/tmp/hosted-xdg-cache \
            XDG_DATA_HOME=/tmp/hosted-xdg-data XDG_STATE_HOME=/tmp/hosted-xdg-state \
            XDG_RUNTIME_DIR=/tmp/hosted-xdg-runtime TMPDIR=/tmp \
            GENTLE_PI_HOSTED_ISOLATION=docker-network-none-readonly-v1 \
            /usr/local/bin/node --experimental-strip-types --test /workspace/tests/hosted-ask-user-question-rpc.test.ts

  hosted-main-acquisition:
    name: Hosted pinned main acquisition and offline artifact validation
    if: github.repository == 'decode2/gentle-pi'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Pull and pin Node 24 acquisition image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null
          docker info >/dev/null
          docker pull node:24-bookworm
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' node:24-bookworm)"
          image_id="$(docker image inspect --format '{{.Id}}' node:24-bookworm)"
          case "$image_ref" in node@sha256:*) ;; *) echo "missing immutable image digest" >&2; exit 1;; esac
          test -n "$image_id"
          printf 'image_ref=%s\nimage_id=%s\n' "$image_ref" "$image_id"
          printf 'ref=%s\nid=%s\n' "$image_ref" "$image_id" >> "$GITHUB_OUTPUT"

      - name: Acquire exact main and frozen dependencies in networked container
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" = "$IMAGE_ID"
          acquisition_dir="$RUNNER_TEMP/questionnaire-main-acquisition"
          test ! -e "$acquisition_dir"
          mkdir "$acquisition_dir"
          chmod 0777 "$acquisition_dir"
          docker run --rm -i --network=bridge --read-only \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$acquisition_dir,target=/artifact" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=1g --pids-limit=256 --cap-drop=ALL \
            --security-opt=no-new-privileges --user 1000:1000 "$IMAGE_REF" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/artifact/home TMPDIR=/artifact/tmp NPM_CONFIG_CACHE=/artifact/npm-cache \
            NPM_CONFIG_USERCONFIG=/dev/null NPM_CONFIG_GLOBALCONFIG=/dev/null PNPM_HOME=/artifact/pnpm-home \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            /usr/local/bin/node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { mkdir, readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const workspace = "/workspace";
          const artifact = "/artifact";
          const manifest = JSON.parse(await readFile(
            `${workspace}/.github/workflows/fixtures/questionnaire-main-acquisition.json`,
            "utf8",
          ));
          const fail = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const gitEnvironment = {
            ...process.env,
            GIT_CONFIG_GLOBAL: "/dev/null",
            GIT_CONFIG_NOSYSTEM: "1",
            GIT_CONFIG_SYSTEM: "/dev/null",
            GIT_OPTIONAL_LOCKS: "0",
            GIT_TERMINAL_PROMPT: "0",
          };
          const main = join(artifact, "main");
          const artifacts = join(artifact, "artifacts");
          const git = (args, options = {}) => execFileSync(
            "git",
            [
              "-c", "core.hooksPath=/dev/null",
              "-c", "diff.external=",
              "-c", "credential.helper=",
              "-C", main,
              ...args,
            ],
            { cwd: main, env: gitEnvironment, encoding: "utf8", ...options },
          );

          fail(manifest.schema === "gentle-pi.hosted-main-acquisition/v1", "invalid acquisition manifest schema");
          fail(manifest.repository === "https://github.com/Gentleman-Programming/gentle-shell.git", "main repository pin changed");
          fail(/^[0-9a-f]{40}$/.test(manifest.commit) && /^[0-9a-f]{40}$/.test(manifest.tree), "invalid main Git pin");
          fail(manifest.package.name === "gentle-pi" && manifest.package.version === "3.3.0" && manifest.package.packageManager === "pnpm@11.1.1", "main package pin changed");
          fail(!Object.keys(process.env).some((key) => /TOKEN|PASSWORD|SECRET|CREDENTIAL|AWS_|GITHUB_/i.test(key)), "network acquisition received credential-like environment");
          await mkdir(main, { recursive: true });
          await mkdir(artifacts, { recursive: true });
          await mkdir(join(artifact, "home"), { recursive: true });
          await mkdir(join(artifact, "tmp"), { recursive: true });
          await mkdir(join(artifact, "npm-cache"), { recursive: true });
          await mkdir(join(artifact, "pnpm-home"), { recursive: true });
          execFileSync("git", ["--version"], { env: gitEnvironment, stdio: "ignore" });
          git(["init", "--initial-branch=main"]);
          git(["remote", "add", "origin", manifest.repository]);
          git(["fetch", "--no-tags", "origin", manifest.commit], { stdio: "ignore" });
          git(["checkout", "--detach", manifest.commit], { stdio: "ignore" });
          const head = git(["rev-parse", "HEAD"]).trim();
          const tree = git(["rev-parse", "HEAD^{tree}"]).trim();
          fail(head === manifest.commit, "Git HEAD does not match the pinned commit");
          fail(tree === manifest.tree, "Git tree does not match the pinned tree");
          const sourceBefore = git(["ls-tree", "-r", "-z", "--full-tree", "HEAD"]);
          const files = sourceBefore.split("\0").filter(Boolean).map((record) => {
            const separator = record.indexOf("\t");
            fail(separator >= 0, "Git tree record is malformed");
            const [mode, type, sha] = record.slice(0, separator).split(" ");
            fail(type === "blob" && Boolean(mode) && Boolean(sha), "main tree contains an unsupported entry");
            return { path: record.slice(separator + 1), mode, sha };
          });
          await writeFile(join(artifacts, "main-provenance.json"), `${JSON.stringify({ repository: manifest.repository, commit: head, tree, files })}\n`);

          const bootstrap = join(artifact, "pnpm-bootstrap");
          execFileSync("npm", ["install", "--prefix", bootstrap, "--no-save", "--package-lock=false", "--ignore-scripts", "--no-audit", "--no-fund", "pnpm@11.1.1"], { cwd: artifact, env: process.env, stdio: "ignore" });
          const pnpm = join(bootstrap, "node_modules/.bin/pnpm");
          fail(execFileSync(pnpm, ["--version"], { cwd: main, env: process.env, encoding: "utf8" }).trim() === "11.1.1", "pnpm bootstrap version changed");
          const help = execFileSync(pnpm, ["install", "--help"], { cwd: main, env: process.env, encoding: "utf8" });
          fail(help.includes("--ignore-pnpmfile"), "pinned pnpm does not document --ignore-pnpmfile");
          execFileSync(pnpm, ["install", "--frozen-lockfile", "--ignore-scripts", "--ignore-pnpmfile", "--reporter=append-only"], { cwd: main, env: process.env, stdio: "ignore" });
          const sourceAfter = git(["ls-tree", "-r", "-z", "--full-tree", "HEAD"]);
          fail(sourceAfter === sourceBefore, "tracked main source changed after dependency installation");
          fail(git(["status", "--porcelain=v1", "--untracked-files=all"]).trim() === "", "main checkout is not clean after dependency installation");
          fail(git(["rev-parse", "HEAD"]).trim() === head, "Git HEAD moved during acquisition");
          fail(git(["rev-parse", "HEAD^{tree}"]).trim() === tree, "Git tree moved during acquisition");
          console.log(`acquisition-proof repository=${manifest.repository} commit=${head} tree=${tree} tracked-files=${files.length} pnpm=11.1.1 frozen-lockfile=true scripts=false pnpmfile=false`);
          NODE

      - name: Run offline artifact validation in isolated container
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" = "$IMAGE_ID"
          acquisition_dir="$RUNNER_TEMP/questionnaire-main-acquisition"
          test -r "$acquisition_dir/main/.git/HEAD"
          test -r "$acquisition_dir/main/package.json"
          test -r "$acquisition_dir/artifacts/main-provenance.json"
          docker run --rm --network=none --read-only \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$acquisition_dir/main,target=/acquired-main,readonly" \
            --mount "type=bind,source=$acquisition_dir/artifacts,target=/acquired-artifacts,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=1g --pids-limit=256 --cap-drop=ALL \
            --security-opt=no-new-privileges --user 1000:1000 -w /workspace "$IMAGE_REF" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp/hosted-home TMPDIR=/tmp \
            ACQUIRED_MAIN_ROOT=/acquired-main ACQUIRED_ARTIFACTS_ROOT=/acquired-artifacts \
            GENTLE_PI_HOSTED_ISOLATION=docker-network-none-readonly-v1 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            /usr/local/bin/node --experimental-strip-types --test /workspace/tests/hosted-questionnaire-main-acquisition.test.ts

      - name: Verify acquisition lane left candidate checkout clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
