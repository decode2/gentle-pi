name: Questionnaire upstream adaptation

on:
  push:
    branches:
      - test/questionnaire-visual-polish-5594c1f4

permissions:
  contents: read

jobs:
  hosted-upstream-acquisition:
    if: github.repository == 'decode2/gentle-pi'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Pull and pin Node 24 acquisition image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null
          docker info >/dev/null
          docker pull node:24-bookworm
          image_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' node:24-bookworm)"
          image_id="$(docker image inspect --format '{{.Id}}' node:24-bookworm)"
          case "$image_ref" in node@sha256:*) ;; *) echo "missing immutable image digest" >&2; exit 1;; esac
          test -n "$image_id"
          printf 'image_ref=%s\nimage_id=%s\n' "$image_ref" "$image_id"
          printf 'ref=%s\nid=%s\n' "$image_ref" "$image_id" >> "$GITHUB_OUTPUT"

      - name: Acquire exact upstream and frozen dependencies in networked container
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" = "$IMAGE_ID"
          acquisition_dir="$RUNNER_TEMP/questionnaire-upstream-acquisition"
          test ! -e "$acquisition_dir"
          mkdir "$acquisition_dir"
          chmod 0777 "$acquisition_dir"
          docker run --rm -i --network=bridge --read-only \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$acquisition_dir,target=/artifact" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=1g --pids-limit=256 --cap-drop=ALL \
            --security-opt=no-new-privileges --user 1000:1000 "$IMAGE_REF" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/artifact/home TMPDIR=/artifact/tmp NPM_CONFIG_CACHE=/artifact/npm-cache \
            NPM_CONFIG_USERCONFIG=/artifact/home/user.npmrc NPM_CONFIG_GLOBALCONFIG=/artifact/home/global.npmrc PNPM_HOME=/artifact/pnpm-home \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            /usr/local/bin/node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { mkdir, readFile } from "node:fs/promises";
          import { join } from "node:path";

          const workspace = "/workspace";
          const artifact = "/artifact";
          const source = join(artifact, "upstream");
          const manifest = JSON.parse(await readFile(`${workspace}/.github/workflows/fixtures/hosted-upstream-questionnaire.json`, "utf8"));
          const fail = (condition, message) => { if (!condition) throw new Error(message); };
          const limit = 256 * 1024;
          const excerpt = (value) => {
            const text = Buffer.isBuffer(value) ? value.toString("utf8") : typeof value === "string" ? value : "";
            return text.length > 4096 ? `${text.slice(0, 4096)}\n...[truncated]` : text;
          };
          const run = (file, args, options = {}) => {
            try {
              return execFileSync(file, args, { cwd: source, encoding: "utf8", ...options, maxBuffer: limit });
            } catch (error) {
              const status = Number.isInteger(error?.status) ? error.status : "unknown";
              console.error(`command failed file=${file} status=${status} stdout=${JSON.stringify(excerpt(error?.stdout))} stderr=${JSON.stringify(excerpt(error?.stderr))}`);
              throw new Error(`command failed: ${file}`);
            }
          };
          const git = (args, options = {}) => run(
            "git",
            ["-c", "core.hooksPath=/dev/null", "-c", "diff.external=", "-c", "credential.helper=", "-C", source, ...args],
            options,
          );

          fail(manifest.schema === "gentle-pi.hosted-upstream-questionnaire-acquisition/v1", "upstream manifest schema changed");
          fail(manifest.repository === "https://github.com/Gentleman-Programming/gentle-shell.git", "upstream repository changed");
          fail(manifest.commit === "f2d9d073ffc2299eb501902753b42789f7cdc461", "upstream commit changed");
          fail(manifest.tree === "6fb42857f728f131da054e592ec5d22c691ce870", "upstream tree changed");
          fail(!Object.keys(process.env).some((key) => /TOKEN|PASSWORD|SECRET|CREDENTIAL|AWS_|GITHUB_/i.test(key)), "network acquisition received credential-like environment");
          await mkdir(source, { recursive: true });
          for (const directory of ["home", "tmp", "npm-cache", "pnpm-home"]) await mkdir(join(artifact, directory), { recursive: true });
          git(["init", "--initial-branch=main"], { stdio: "ignore" });
          git(["remote", "add", "origin", manifest.repository], { stdio: "ignore" });
          git(["fetch", "--no-tags", "origin", manifest.commit], { stdio: "ignore" });
          git(["checkout", "--detach", manifest.commit], { stdio: "ignore" });
          const head = git(["rev-parse", "HEAD"]).trim();
          const tree = git(["rev-parse", "HEAD^{tree}"]).trim();
          fail(head === manifest.commit, "Git HEAD does not match the pinned upstream commit");
          fail(tree === manifest.tree, "Git tree does not match the pinned upstream tree");
          const sourceBefore = git(["ls-tree", "-r", "-z", "--full-tree", "HEAD"]);
          const records = sourceBefore.split("\0").filter(Boolean);
          fail(records.length === manifest.trackedFileCount, "upstream tracked inventory changed");
          for (const path of manifest.questionnairePaths) fail(records.some((record) => record.endsWith(`\t${path}`)), `missing questionnaire path: ${path}`);

          const bootstrap = join(artifact, "pnpm-bootstrap");
          run("npm", ["install", "--prefix", bootstrap, "--no-save", "--package-lock=false", "--ignore-scripts", "--no-audit", "--no-fund", "pnpm@11.1.1"], { cwd: artifact });
          const pnpm = join(bootstrap, "node_modules/.bin/pnpm");
          fail(run(pnpm, ["--version"]).trim() === "11.1.1", "pnpm bootstrap version changed");
          run(pnpm, ["install", "--frozen-lockfile", "--ignore-scripts", "--ignore-pnpmfile", "--reporter=append-only"], { stdio: "ignore" });
          fail(git(["ls-tree", "-r", "-z", "--full-tree", "HEAD"]) === sourceBefore, "tracked upstream source changed after dependency installation");
          fail(git(["status", "--porcelain=v1", "--untracked-files=all"]) === "", "upstream checkout is not clean after dependency installation");
          fail(git(["rev-parse", "HEAD"]).trim() === head && git(["rev-parse", "HEAD^{tree}"]).trim() === tree, "Git identity moved during dependency installation");
          console.log(`acquisition-proof root=${artifact} repository=${manifest.repository} commit=${head} tree=${tree} tracked-files=${records.length} pnpm=11.1.1 frozen-lockfile=true scripts=false native=false`);
          NODE

      - name: Validate upstream artifact offline and run scoped strict TypeScript
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" = "$IMAGE_ID"
          acquisition_dir="$RUNNER_TEMP/questionnaire-upstream-acquisition"
          docker run --rm --network=none --read-only \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$acquisition_dir/upstream,target=/acquired-upstream,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=1g --pids-limit=256 --cap-drop=ALL \
            --security-opt=no-new-privileges --user 1000:1000 -w /workspace "$IMAGE_REF" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp/hosted-home TMPDIR=/tmp \
            ACQUIRED_UPSTREAM_ROOT=/acquired-upstream GENTLE_PI_HOSTED_ISOLATION=docker-network-none-readonly-v1 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            /bin/sh -eu -c '
              /usr/local/bin/node --experimental-strip-types --test /workspace/tests/hosted-upstream-questionnaire-acquisition.test.ts
              /usr/local/bin/node /acquired-upstream/node_modules/typescript/bin/tsc \
                --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext \
                --allowImportingTsExtensions --typeRoots /acquired-upstream/node_modules/@types --types node \
                /workspace/tests/hosted-upstream-questionnaire-acquisition.test.ts
            '

      - name: Compose derived questionnaire artifact offline and run strict RED contract
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" = "$IMAGE_ID"
          acquisition_dir="$RUNNER_TEMP/questionnaire-upstream-acquisition"
          composition_dir="$RUNNER_TEMP/questionnaire-upstream-composition"
          test ! -e "$composition_dir"
          mkdir "$composition_dir"
          chmod 0777 "$composition_dir"
          docker run --rm --network=none --read-only \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$acquisition_dir/upstream,target=/acquired-upstream,readonly" \
            --mount "type=bind,source=$composition_dir,target=/artifact" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=1g --pids-limit=256 --cap-drop=ALL \
            --security-opt=no-new-privileges --user 1000:1000 -w /workspace "$IMAGE_REF" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp/hosted-home TMPDIR=/tmp \
            ACQUIRED_UPSTREAM_ROOT=/acquired-upstream COMPOSITION_ARTIFACT_ROOT=/artifact GENTLE_PI_HOSTED_ISOLATION=docker-network-none-readonly-v1 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            /bin/sh -eu -c '
              /usr/local/bin/node /acquired-upstream/node_modules/typescript/bin/tsc \
                --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext \
                --allowImportingTsExtensions --typeRoots /acquired-upstream/node_modules/@types --types node \
                /workspace/tests/fixtures/hosted-compose-upstream-questionnaire.ts \
                /workspace/tests/hosted-upstream-questionnaire-composition.test.ts
              /usr/local/bin/node --experimental-strip-types --test /workspace/tests/hosted-upstream-questionnaire-composition.test.ts
            '

      - name: Verify staged derived questionnaire artifact is read-only
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" = "$IMAGE_ID"
          composition_dir="$RUNNER_TEMP/questionnaire-upstream-composition"
          derived_dir="$composition_dir/zero-patch/derived"
          test -d "$derived_dir"
          docker run --rm --network=none --read-only \
            --mount "type=bind,source=$derived_dir,target=/derived,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=256m --pids-limit=64 --cap-drop=ALL \
            --security-opt=no-new-privileges --user 1000:1000 "$IMAGE_REF" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /bin/sh -eu -c '
              test -f /derived/package.json
              if touch /derived/.read-only-probe 2>/dev/null; then exit 1; fi
            '

      - name: Compose Herdr compatibility artifact offline
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" = "$IMAGE_ID"
          acquisition_dir="$RUNNER_TEMP/questionnaire-upstream-acquisition"
          herdr_dir="$RUNNER_TEMP/questionnaire-upstream-herdr"
          test ! -e "$herdr_dir"
          mkdir "$herdr_dir"
          chmod 0777 "$herdr_dir"
          docker run --rm --network=none --read-only \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$acquisition_dir/upstream,target=/acquired-upstream,readonly" \
            --mount "type=bind,source=$herdr_dir,target=/artifact" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=1g --pids-limit=256 --cap-drop=ALL \
            --security-opt=no-new-privileges --user 1000:1000 -w /workspace "$IMAGE_REF" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp/hosted-home TMPDIR=/tmp \
            ACQUIRED_UPSTREAM_ROOT=/acquired-upstream HERDR_ARTIFACT_ROOT=/artifact GENTLE_PI_HOSTED_ISOLATION=docker-network-none-readonly-v1 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            /bin/sh -eu -c '
              /usr/local/bin/node --experimental-strip-types --input-type=module <<'"'"'NODE'"'"'
          import { execFileSync } from "node:child_process";
          import { copyFile, mkdir, readdir, readFile } from "node:fs/promises";
          import { join } from "node:path";
          import { composeUpstreamQuestionnaireArtifact } from "/workspace/tests/fixtures/hosted-compose-upstream-questionnaire.ts";

          const workspace = "/workspace";
          const artifact = "/artifact";
          const basePath = `${workspace}/.github/workflows/fixtures/hosted-upstream-questionnaire.json`;
          const manifestPath = `${workspace}/.github/workflows/fixtures/hosted-upstream-questionnaire-herdr.json`;
          const base = JSON.parse(await readFile(basePath, "utf8"));
          const manifest = JSON.parse(await readFile(manifestPath, "utf8"));
          const fail = (condition, message) => { if (!condition) throw new Error(message); };
          fail(manifest.schema === "gentle-pi.hosted-upstream-questionnaire-herdr/v1", "Herdr manifest schema changed");
          fail(manifest.baseManifest === ".github/workflows/fixtures/hosted-upstream-questionnaire.json", "Herdr base manifest changed");
          for (const key of ["repository", "commit", "tree"]) fail(manifest.base?.[key] === base[key], `Herdr base ${key} changed`);
          const composition = manifest.composition;
          fail(composition.schema === "gentle-pi.hosted-upstream-questionnaire-composition/v1", "Herdr composition schema changed");
          fail(composition.derivedDirectory === "derived" && composition.patchDirectory === "patches/questionnaire-upstream", "Herdr composition directories changed");
          const expectedFiles = ["001-blocked-event-producer-test.patch", "002-blocked-event-herdr-integration-test.patch"];
          const expectedTargets = ["tests/ask-user-question.test.ts", "tests/gentle-ai.test.ts"];
          const expectedAllowed = ["extensions/ask-user-question.ts", ...expectedTargets];
          const expectedProtected = ["extensions/gentle-ai.ts", "lib/native-fullscreen-interaction.ts"];
          fail(JSON.stringify(composition.patchInventory.map((patch) => patch.file)) === JSON.stringify(expectedFiles), "Herdr patch ordering changed");
          fail(JSON.stringify(composition.patchInventory.map((patch) => patch.target)) === JSON.stringify(expectedTargets), "Herdr patch targets changed");
          fail(JSON.stringify(composition.allowedTargets) === JSON.stringify(expectedAllowed), "Herdr allowed targets changed");
          fail(JSON.stringify(composition.protectedTargets) === JSON.stringify(expectedProtected), "Herdr protected targets changed");

          const herdrRoot = join(artifact, "herdr");
          const patchRoot = join(herdrRoot, composition.patchDirectory);
          const outputRoot = join(herdrRoot, composition.derivedDirectory);
          await mkdir(patchRoot, { recursive: true });
          for (const patch of composition.patchInventory) {
            const patchPath = join(patchRoot, patch.file);
            await copyFile(join(workspace, "tests/fixtures/upstream-questionnaire/patches", patch.file), patchPath);
            const changed = execFileSync("git", ["-C", "/acquired-upstream", "apply", "--numstat", "--summary", patchPath], { encoding: "utf8" });
            const changedPaths = changed.split("\n").filter((line) => line.includes("\t")).map((line) => line.slice(line.lastIndexOf("\t") + 1)).filter(Boolean);
            fail(changedPaths.length === 1 && changedPaths[0] === patch.target, `Herdr changed path mismatch: ${patch.file}`);
          }
          const staged = (await readdir(patchRoot)).sort();
          fail(JSON.stringify(staged) === JSON.stringify(expectedFiles), "Herdr staged patch set changed");
          await composeUpstreamQuestionnaireArtifact({ sourceRoot: "/acquired-upstream", patchRoot, outputRoot, manifest: composition });
          console.log(`herdr-composition-proof root=${outputRoot} base=${manifest.base.commit} patches=${expectedFiles.join(",")} targets=${expectedTargets.join(",")}`);
          NODE
            '

      - name: Run Herdr RED regression in read-only isolation
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_ID: ${{ steps.image.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" = "$IMAGE_ID"
          acquisition_dir="$RUNNER_TEMP/questionnaire-upstream-acquisition"
          herdr_dir="$RUNNER_TEMP/questionnaire-upstream-herdr"
          derived_dir="$herdr_dir/herdr/derived"
          test -d "$derived_dir"
          docker run --rm --network=none --read-only \
            --mount "type=bind,source=$derived_dir,target=/derived,readonly" \
            --mount "type=bind,source=$acquisition_dir/upstream,target=/acquired-upstream,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=2g --pids-limit=256 --cap-drop=ALL \
            --security-opt=no-new-privileges --user 1000:1000 -w /derived "$IMAGE_REF" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp/hosted-home TMPDIR=/tmp \
            NODE_OPTIONS=--max-old-space-size=1536 GENTLE_PI_HOSTED_ISOLATION=docker-network-none-readonly-v1 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            /bin/sh -eu -c '
              if touch /derived/.red-read-only-probe 2>/dev/null; then exit 1; fi
              /usr/local/bin/node /acquired-upstream/node_modules/typescript/bin/tsc \
                --noEmit --strict --skipLibCheck --target ES2022 --module NodeNext --moduleResolution NodeNext \
                --allowImportingTsExtensions --typeRoots /acquired-upstream/node_modules/@types --types node \
                /derived/extensions/ask-user-question.ts /derived/extensions/gentle-ai.ts \
                /derived/tests/ask-user-question.test.ts /derived/tests/gentle-ai.test.ts
              set +e
              output="$(/usr/local/bin/node --experimental-strip-types --test /derived/tests/ask-user-question.test.ts /derived/tests/gentle-ai.test.ts 2>&1)"
              status=$?
              set -e
              printf "%s\\n" "$output"
              test "$status" -ne 0
              test "$(printf "%s\\n" "$output" | grep -Ec "^not ok ")" -eq 1
              printf "%s\\n" "$output" | grep -F "actual questionnaire producer drives Herdr through a private balanced compatibility lifecycle" >/dev/null
              printf "%s\\n" "$output" | grep -Eq "^# fail 1$"
            '

      - name: Verify final hosted candidate checkout cleanliness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
