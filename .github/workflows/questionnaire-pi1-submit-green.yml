name: UM10b source-only Submit GREEN with TAP directive controls
on:
  push:
    branches: [feat/questionnaire-pi1-submit-green-evidence]
permissions:
  contents: read
jobs:
  submit-green:
    if: >-
      (github.repository == 'Gentleman-Programming/gentle-shell' || github.repository == 'decode2/gentle-pi') &&
      github.event_name == 'push' && github.ref == 'refs/heads/feat/questionnaire-pi1-submit-green-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE: 4442dc35384085045457608ea09c9a06416b3cc3
      IMAGE: node@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze complete parent, candidate and sealed guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/feat/questionnaire-pi1-submit-green-evidence
          case "$GITHUB_REPOSITORY" in Gentleman-Programming/gentle-shell|decode2/gentle-pi) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$EXPECTED_SHA" != "$BASE"
          git merge-base --is-ancestor "$BASE" "$EXPECTED_SHA"
          test "$(git rev-parse "$BASE^{tree}")" = a5765061019f30d39e5d07a71b75d7530c2d716d
          test "$(git ls-tree -r "$BASE" | wc -l)" -eq 771
          parent_index=$(git ls-tree -r "$BASE" | awk 'BEGIN {FS="\t"} {split($1,a," "); print a[1] " " a[3] " 0\t" $2}' | git hash-object --stdin)
          test "$parent_index" = cbec2e9266a9979dbcaa6af8fe9e19eea468a4d1
          test "$(git rev-parse "HEAD:lib/questionnaire/questionnaire-view.ts")" = 6255869fc85792164809102c7058dc387bd089ee
          test "$(git rev-parse "HEAD:tests/questionnaire-view.test.ts")" = 75bbbfe36d00d9d39efa451995a73ec397cc2482
          test "$(git rev-parse "HEAD:tests/questionnaire-pi1-submit.test.ts")" = 2d2a54d8b9c72255b9163e2ab8b9661bc19fd455
          test "$(git rev-parse "HEAD:odd/tasks/questionnaire-pi1-explicit-submit.md")" = b78527d92c1113b0d42bfb4323a2e8f2fcc5914f
          paths=$(git diff --name-only "$BASE" HEAD)
          test "$paths" = "$(printf '%s\n' .github/workflows/questionnaire-pi1-submit-green.yml odd/tasks/questionnaire-pi1-submit-green-evidence.md)"
          test "$(git diff --diff-filter=A --name-only "$BASE" HEAD)" = "$paths"
          changes=$(git diff --numstat "$BASE" HEAD | awk '{if ($1 !~ /^[0-9]+$/ || $2 !~ /^[0-9]+$/) exit 1; n+=$1+$2} END {print n+0}')
          test "$changes" -le 400
          while IFS=$'\t' read -r metadata path; do
            test "$(git ls-tree HEAD -- "$path")" = "$metadata$(printf '\t')$path"
          done < <(git ls-tree -r "$BASE")
          guard="$RUNNER_TEMP/submit-guard"
          mkdir -m 0755 "$guard"
          cat > "$guard/identity.sh" <<'GUARD'
          freeze() {
            local root="$1" dependencies="${2:-no}" metadata path blob mode indexed directory ignored
            test -d "$root" && test ! -L "$root"
            test -d "$root/.git" && test ! -L "$root/.git"
            for path in .git/HEAD .git/index .git/config; do test -f "$root/$path" && test ! -L "$root/$path"; done
            test "$(git -c safe.directory="$root" -C "$root" rev-parse HEAD)" = "$EXPECTED_SHA"
            test -z "$(GIT_OPTIONAL_LOCKS=0 git -c safe.directory="$root" -C "$root" status --porcelain=v1 --untracked-files=all)"
            git -c safe.directory="$root" -C "$root" diff --quiet HEAD --
            git -c safe.directory="$root" -C "$root" diff --cached --quiet HEAD --
            test "$(git -c safe.directory="$root" -C "$root" ls-files -s | wc -l)" -eq 773
            ignored=$(git -c safe.directory="$root" -C "$root" ls-files --others --ignored --exclude-standard --directory)
            if test "$dependencies" = yes; then test "$ignored" = node_modules/; else test -z "$ignored"; fi
            while IFS=$'\t' read -r metadata path; do
              blob="${metadata##* }"; mode="${metadata%% *}"
              indexed=$(git -c safe.directory="$root" -C "$root" ls-files -s -- "$path")
              test "$indexed" = "$mode $blob 0$(printf '\t')$path"
              test "$(git -c safe.directory="$root" -C "$root" hash-object --path="$path" "$path")" = "$blob"
              case "$path" in
                runtime/windows-session-transport.ps1|tests/fixtures/windows-session-bootstrap.ps1|tests/fixtures/windows-session-compile.ps1) ;;
                *) test "$(git -c safe.directory="$root" -C "$root" hash-object --no-filters "$path")" = "$blob" ;;
              esac
              case "$mode" in
                100644) test -f "$root/$path" && test ! -L "$root/$path" && test ! -x "$root/$path" ;;
                100755) test -f "$root/$path" && test ! -L "$root/$path" && test -x "$root/$path" ;;
                *) return 1 ;;
              esac
              directory=$(dirname "$path")
              while test "$directory" != .; do
                test -d "$root/$directory" && test ! -L "$root/$directory"
                directory=$(dirname "$directory")
              done
            done < <(git -c safe.directory="$root" -C "$root" ls-tree -r HEAD)
          }
          GUARD
          cat > "$guard/tap.mjs" <<'TAP'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const [mode, filename, exit] = process.argv.slice(2);
          assert.ok(fs.statSync(filename).size < 2_000_000, "bounded raw TAP");
          const text = fs.readFileSync(filename, "utf8");
          assert.match(text, /^TAP version 13$/m);
          const forbidden = /Bail out!|^[ \t]*(?:not )?ok\b[^\n]*#\s*(?:SKIP|TODO)\b/im;
          assert.doesNotMatch("# todo 0\n# skipped 0", forbidden);
          for (const sample of [
            "ok 1 - sample # SKIP", "not ok 1 - sample # TODO",
            "\tOk 1 - sample # tOdO", "  NoT oK 1 - sample # sKiP",
            "prefix Bail out! failure",
          ]) {
            assert.throws(() => assert.doesNotMatch(sample, forbidden));
          }
          for (const key of ["todo", "skipped"]) {
            const exactZero = new RegExp(`^# ${key} 0$`, "gm");
            assert.equal(`# ${key} 0`.match(exactZero)?.length, 1);
            assert.throws(() => assert.equal(`# ${key} 1`.match(exactZero)?.length, 1));
            assert.throws(() => assert.equal(`# ${key} 0\n# ${key} 0`.match(exactZero)?.length, 1));
          }
          console.log("TAP_DIRECTIVE_NEGATIVE_CONTROLS verified");
          assert.doesNotMatch(text, forbidden);
          const results = [...text.matchAll(/^(not ok|ok) (\d+) - (.*)$/gm)];
          const summaries = (counts) => {
            for (const [key, value] of Object.entries(counts)) {
              assert.equal(text.match(new RegExp(`^# ${key} ${value}$`, "gm"))?.length, 1, key);
              assert.equal(text.match(new RegExp(`^# ${key} `, "gm"))?.length, 1, key);
            }
          };
          assert.equal(exit, "0");
          let titles;
          if (mode === "baseline") {
            titles = [
              "renders exactly one active question plus a tab strip for all questions",
              "Tab and Shift-Tab switch the active question and preserve cursor and toggles",
              "real key sequences drive the cursor and commit in legacy and application-cursor form",
              "the injected KeybindingsManager drives the same navigation and commit",
              "single-select stages on Enter and explicit Next advances before final Submit",
              "multi-select stages empty selections and toggles with space before explicit Submit",
              "custom row opens the editor, empty submit returns, and the draft survives a tab switch",
              "multi-select can stage a custom answer with the toggled options before Submit",
              "preview renders beside the list only while the focused option has one",
              "the preview pane wraps cleanly and never exceeds the terminal width",
              "narrow widths render the preview inline without corrupting the body",
              "height stays bounded as the question count grows",
              "Escape cancels the questionnaire with a cancelled result",
              "focus propagates to the free-text input for IME cursor positioning",
              "a committed option carries its preview on the answer row",
              "pointer press focuses rows and actions; click stages or explicitly advances/submits",
              "pointer click toggles a multi-select option instead of committing",
              "pointer click on the custom row opens the editor without committing",
              "the custom row is always appended after the authored options",
              "every rendered line fits the width across 1-4 questions",
            ];
          } else {
            assert.equal(mode, "submit");
            titles = [
              "single choice waits for explicit Submit",
              "nonempty MULTI waits and preserves option order",
              "custom editor save waits for explicit Submit",
              "Next navigates before ordered final Submit",
              "empty optional MULTI submits an empty selection",
              "mouse edits remain pending and Submit sends latest answer",
              "unanswered Escape cancels once without submitting",
            ].map(title => `UM09a Pi1 Submit: ${title}`);
          }
          assert.equal(results.length, titles.length);
          assert.equal([...text.matchAll(/^# Subtest: /gm)].length, titles.length);
          assert.match(text, new RegExp(`^1\\.\\.${titles.length}$`, "m"));
          titles.forEach((title, index) => {
            const result = results[index];
            assert.equal(result[1], "ok");
            assert.equal(result[2], String(index + 1));
            assert.equal(result[3], title);
            assert.equal(text.split(`# Subtest: ${title}\n`).length, 2);
          });
          summaries({tests: titles.length, pass: titles.length, fail: 0, cancelled: 0, skipped: 0, todo: 0});
          TAP
          printf '[safe]\n\tdirectory = /source\n\tdirectory = /source/.git\n\tdirectory = /workspace\n' > "$guard/offline.gitconfig"
          (cd "$guard"; sha256sum identity.sh tap.mjs offline.gitconfig) > "$RUNNER_TEMP/submit-guard.sha256"
          chmod 0444 "$guard/identity.sh" "$guard/tap.mjs" "$guard/offline.gitconfig" "$RUNNER_TEMP/submit-guard.sha256"
          source "$guard/identity.sh"
          freeze "$GITHUB_WORKSPACE"
          sha256sum "$GITHUB_WORKSPACE/.git/config" > "$RUNNER_TEMP/submit-original.sha256"
          for path in .github/workflows/questionnaire-pi1-submit-green.yml odd/tasks/questionnaire-pi1-submit-green-evidence.md; do
            echo "CANDIDATE $path $(git rev-parse "HEAD:$path")"
          done
          echo "SOURCE-ONLY candidate=$EXPECTED_SHA changes=$changes; acquisition is not semantic evidence"
      - name: Independent frozen acquisition (networked, no semantic evidence)
        shell: bash
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/submit-guard"
          (cd "$guard"; sha256sum --check "$RUNNER_TEMP/submit-guard.sha256")
          source "$guard/identity.sh"
          freeze "$GITHUB_WORKSPACE"
          docker pull --platform linux/amd64 "$IMAGE"
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = sha256:b795e77f6c253b171f482eff27b9b882dc4cdcb42d773372e298481c7318fbc2
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          artifact="$RUNNER_TEMP/submit-artifact"
          test ! -e "$artifact"
          mkdir -m 0777 "$artifact"
          docker run --rm --platform linux/amd64 --network=bridge --read-only --user 1000:1000 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$guard,target=/guard,readonly" \
            --mount "type=bind,source=$artifact,target=/artifact" \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m --cpus=1 --memory=2g --pids-limit=256 \
            --cap-drop=ALL --security-opt=no-new-privileges "$IMAGE" \
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/artifact/home TMPDIR=/tmp \
            XDG_CONFIG_HOME=/artifact/home XDG_CACHE_HOME=/artifact/cache XDG_DATA_HOME=/artifact/data XDG_STATE_HOME=/artifact/state \
            GENTLE_PI_AGENT_HOME=/artifact/selected PI_CODING_AGENT_DIR=/artifact/sdk \
            NPM_CONFIG_CACHE=/artifact/cache NPM_CONFIG_USERCONFIG=/artifact/home/user.npmrc NPM_CONFIG_GLOBALCONFIG=/artifact/home/global.npmrc \
            EXPECTED_SHA="$EXPECTED_SHA" GIT_CONFIG_NOSYSTEM=1 /bin/bash -euo pipefail -c '
              mkdir /artifact/home /artifact/cache /artifact/data /artifact/state /artifact/selected /artifact/sdk
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /workspace/.git
              (cd /artifact/home; sha256sum .gitconfig) > /artifact/home.sha256
              chmod 0444 /artifact/home/.gitconfig
              source /guard/identity.sh
              git clone --no-local --no-checkout /workspace /artifact/source
              cd /artifact/source
              git checkout --detach "$EXPECTED_SHA"
              freeze /workspace; freeze /artifact/source
              (cd /artifact/source; sha256sum .git/config) > /artifact/clone.sha256
              npm install --prefix /artifact/bootstrap --no-save --package-lock=false --ignore-scripts --no-audit --no-fund pnpm@11.1.1
              pnpm=/artifact/bootstrap/node_modules/.bin/pnpm
              test "$("$pnpm" --version)" = 11.1.1
              "$pnpm" install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --reporter=append-only
              freeze /workspace; freeze /artifact/source yes
              (cd /artifact/source; sha256sum --check /artifact/clone.sha256)
              (cd /artifact/home; sha256sum --check /artifact/home.sha256)
              chmod 0444 /artifact/clone.sha256 /artifact/home.sha256
            '
          freeze "$GITHUB_WORKSPACE"
          freeze "$artifact/source" yes
          sha256sum --check "$RUNNER_TEMP/submit-original.sha256"
          chmod 0444 "$RUNNER_TEMP/submit-original.sha256"
      - name: Offline compatibility and strict baseline20 plus Submit7 GREEN
        shell: bash
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/submit-guard"
          artifact="$RUNNER_TEMP/submit-artifact"
          (cd "$guard"; sha256sum --check "$RUNNER_TEMP/submit-guard.sha256")
          docker run --rm --platform linux/amd64 --network=none --read-only --user 1000:1000 \
            --mount "type=bind,source=$artifact/source,target=/source,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$guard,target=/guard,readonly" \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m --cpus=1 --memory=2g --pids-limit=256 \
            --cap-drop=ALL --security-opt=no-new-privileges -w /source "$IMAGE" \
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp/home TMPDIR=/tmp \
            XDG_CONFIG_HOME=/tmp/config XDG_CACHE_HOME=/tmp/cache XDG_DATA_HOME=/tmp/data XDG_STATE_HOME=/tmp/state \
            GENTLE_PI_AGENT_HOME=/tmp/selected PI_CODING_AGENT_DIR=/tmp/sdk \
            NPM_CONFIG_CACHE=/tmp/cache NPM_CONFIG_USERCONFIG=/tmp/home/user.npmrc NPM_CONFIG_GLOBALCONFIG=/tmp/home/global.npmrc \
            GIT_CONFIG_GLOBAL=/guard/offline.gitconfig GIT_CONFIG_NOSYSTEM=1 EXPECTED_SHA="$EXPECTED_SHA" \
            NODE_OPTIONS=--max-old-space-size=1536 /bin/bash -euo pipefail -c '
              mkdir /tmp/home /tmp/config /tmp/cache /tmp/data /tmp/state /tmp/selected /tmp/sdk
              source /guard/identity.sh
              freeze /workspace; freeze /source yes
              for root in /workspace /source /source/node_modules /guard; do
                if touch "$root/.read-only-probe" 2>/dev/null; then echo "write denial failed: $root" >&2; exit 1; fi
              done
              node --input-type=module -e '\''
                import fs from "node:fs";
                import path from "node:path";
                import assert from "node:assert/strict";
                import { fileURLToPath } from "node:url";
                import { createRequire } from "node:module";
                function metadata(entry, name, version) {
                  let directory = path.dirname(entry);
                  while (true) {
                    const candidate = path.join(directory, "package.json");
                    if (fs.existsSync(candidate)) {
                      const value = JSON.parse(fs.readFileSync(candidate, "utf8"));
                      if (value.name === name) { assert.equal(value.version, version); return; }
                    }
                    const parent = path.dirname(directory);
                    assert.notEqual(parent, directory);
                    directory = parent;
                  }
                }
                assert.equal(JSON.parse(fs.readFileSync("package.json", "utf8")).version, "4.0.0");
                const sdk = import.meta.resolve("@earendil-works/pi-coding-agent");
                for (const [name, version] of [
                  ["@earendil-works/pi-coding-agent", "1.0.0"], ["@earendil-works/pi-ai", "1.0.0"],
                  ["@earendil-works/pi-tui", "1.0.0"], ["typebox", "1.1.38"],
                ]) metadata(fileURLToPath(import.meta.resolve(name)), name, version);
                metadata(createRequire(sdk).resolve("typebox"), "typebox", "1.3.27");
              '\''
              node --experimental-strip-types --input-type=module -e '\''
                import "./lib/questionnaire/questionnaire-view.ts";
                import "./lib/questionnaire/schema.ts";
                import "./lib/terminal-theme.ts";
              '\''
              node node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck \
                --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions \
                --lib ES2022,DOM --typeRoots /source/node_modules/@types --types node \
                tests/questionnaire-view.test.ts tests/questionnaire-pi1-submit.test.ts \
                lib/questionnaire/questionnaire-view.ts lib/questionnaire/schema.ts lib/terminal-theme.ts
              node scripts/check-types.mjs | tee /tmp/types.tap
              grep -F "recorded diagnostic(s), no regressions" /tmp/types.tap
              set +e
              baseline=$(node --experimental-strip-types --test --test-reporter=tap tests/questionnaire-view.test.ts 2>&1)
              baseline_exit=$?
              set -e
              printf "%s\n" "$baseline" | tee /tmp/baseline.tap
              node /guard/tap.mjs baseline /tmp/baseline.tap "$baseline_exit"
              set +e
              submit=$(node --experimental-strip-types --test --test-reporter=tap tests/questionnaire-pi1-submit.test.ts 2>&1)
              submit_exit=$?
              set -e
              printf "%s\n" "$submit" | tee /tmp/submit.tap
              node /guard/tap.mjs submit /tmp/submit.tap "$submit_exit"
              echo "SUBMIT_BEHAVIOR_GREEN verified"
              freeze /workspace; freeze /source yes
            '
      - name: Always verify both exact source identities and immutable seals
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/submit-guard"
          artifact="$RUNNER_TEMP/submit-artifact"
          (cd "$guard"; sha256sum --check "$RUNNER_TEMP/submit-guard.sha256")
          source "$guard/identity.sh"
          freeze "$GITHUB_WORKSPACE"
          sha256sum --check "$RUNNER_TEMP/submit-original.sha256"
          (cd "$artifact/source"; sha256sum --check "$artifact/clone.sha256")
          (cd "$artifact/home"; sha256sum --check "$artifact/home.sha256")
          freeze "$artifact/source" yes
