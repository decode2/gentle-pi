name: Current-upstream questionnaire UM-04a behavioral GREEN

on:
  push:
    branches:
      - feat/questionnaire-current-main-partial-cancel

permissions:
  contents: read

jobs:
  behavioral-green:
    # A push event on this exact feature branch is the only source of exact-SHA behavioral GREEN evidence.
    if: >-
      (github.repository == 'Gentleman-Programming/gentle-pi' ||
       github.repository == 'decode2/gentle-pi') &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/questionnaire-current-main-partial-cancel'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE: 7c96f0bb3e9beae5ba7baa2a278c0cfe6ce28639
      IMAGE: node@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4 # previously hosted-verified Node 24 image
      UM04A_TEST_BLOB: 7a77748bcee5a37c5bb67ab189c509c618c8cdde
      UM03B_VIEW_BLOB: 075b41f1e806559affe0dea4bc593e33a5b045e2
      UM03B_VIEW_TEST_BLOB: 6ea13ae1857d9829c7f2ce0fb3b710f73c146386
      UM04A_BASE_PRODUCER_BLOB: ad017afe99a43c3fad92cfa95e3653dd32a66bec
      UM04A_PRODUCER_BLOB: 440346d2069f6f5f89afc32246bbc2fa70921ae8
      UM02_ASK_TEST_BLOB: 7ed196be37ec582dd915778b9d570f5774053e19
    steps:
      - name: Checkout exact event revision without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact-SHA UM-04a GREEN source and frozen input identities
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$EXPECTED_SHA" != "$BASE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git cat-file -e "$BASE^{commit}"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/questionnaire-current-upstream.yml|odd/tasks/questionnaire-current-upstream.md|tests/ask-user-question.test.ts|extensions/ask-user-question.ts) ;;
              *) echo "unexpected UM-04a GREEN path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          for path in \
            package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json \
            scripts/check-types.mjs scripts/types-baseline.json \
            extensions/gentle-ai.ts \
            lib/questionnaire/schema.ts lib/questionnaire/validate.ts \
            lib/native-fullscreen-interaction.ts tests/questionnaire-schema.test.ts \
            tests/gentle-ai.test.ts; do
            base_blob="$(git rev-parse "$BASE:$path")"
            test "$(git rev-parse "HEAD:$path")" = "$base_blob"
            test "$(git hash-object -- "$path")" = "$base_blob"
          done
          for entry in "tests/questionnaire-view.test.ts:$UM03B_VIEW_TEST_BLOB" \
            "lib/questionnaire/questionnaire-view.ts:$UM03B_VIEW_BLOB"; do
            path="${entry%%:*}"; blob="${entry#*:}"
            test "$(git rev-parse "$BASE:$path")" = "$blob"
            test "$(git rev-parse "HEAD:$path")" = "$blob"
            test "$(git hash-object -- "$path")" = "$blob"
          done
          test "$(git rev-parse "$BASE:extensions/ask-user-question.ts")" = "$UM04A_BASE_PRODUCER_BLOB"
          test "$(git rev-parse HEAD:extensions/ask-user-question.ts)" = "$UM04A_PRODUCER_BLOB"
          test "$(git hash-object -- extensions/ask-user-question.ts)" = "$UM04A_PRODUCER_BLOB"
          test "$(git rev-parse "$BASE:tests/ask-user-question.test.ts")" = "$UM02_ASK_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/ask-user-question.test.ts)" = "$UM04A_TEST_BLOB"
          test "$(git hash-object -- tests/ask-user-question.test.ts)" = "$UM04A_TEST_BLOB"
          echo "UM-04a GREEN checkout=$EXPECTED_SHA base=$BASE ask-test=$UM04A_TEST_BLOB prior-ask-test=$UM02_ASK_TEST_BLOB view-test=$UM03B_VIEW_TEST_BLOB view=$UM03B_VIEW_BLOB producer=$UM04A_PRODUCER_BLOB"

      - name: Acquire pinned Node image and verify image identity
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          test "$image_id" = sha256:b795e77f6c253b171f482eff27b9b882dc4cdcb42d773372e298481c7318fbc2
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          echo "id=$image_id" >> "$GITHUB_OUTPUT"
          echo "acquisition image=$IMAGE id=$image_id"

      - name: Install independent frozen dependencies in networked acquisition artifact
        shell: bash
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$IMAGE_ID"
          artifact="$RUNNER_TEMP/questionnaire-baseline"
          test ! -e "$artifact"
          mkdir "$artifact"
          chmod 0777 "$artifact"
          docker run --rm --network=bridge --read-only \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$artifact,target=/artifact" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=2g --pids-limit=256 \
            --cap-drop=ALL --security-opt=no-new-privileges --user 1000:1000 \
            -e EXPECTED_SHA "$IMAGE" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/artifact/home TMPDIR=/artifact/tmp NPM_CONFIG_CACHE=/artifact/npm-cache \
            NPM_CONFIG_USERCONFIG=/artifact/home/user.npmrc NPM_CONFIG_GLOBALCONFIG=/artifact/home/global.npmrc \
            PNPM_HOME=/artifact/pnpm-home GIT_CONFIG_GLOBAL=/artifact/home/gitconfig GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_SYSTEM=/dev/null GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            EXPECTED_SHA="$EXPECTED_SHA" /bin/bash -euo pipefail -c '
              mkdir -p /artifact/{home,tmp,npm-cache,pnpm-home}
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /workspace/.git
              git clone --no-local --no-checkout /workspace /artifact/source
              cd /artifact/source
              git checkout --detach "$EXPECTED_SHA"
              test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
              test -z "$(git status --porcelain=v1 --untracked-files=all)"
              grep -Eq "^[[:space:]]*\"packageManager\": \"pnpm@11[.]1[.]1\"$" package.json
              npm install --prefix /artifact/pnpm-bootstrap --no-save --package-lock=false \
                --ignore-scripts --no-audit --no-fund pnpm@11.1.1
              pnpm=/artifact/pnpm-bootstrap/node_modules/.bin/pnpm
              test "$("$pnpm" --version)" = 11.1.1
              "$pnpm" install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --reporter=append-only
              test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
              test -z "$(git status --porcelain=v1 --untracked-files=all)"
              echo "acquired checkout=$EXPECTED_SHA pnpm=11.1.1 frozen-lockfile=true scripts=false"
            '

      - name: Run strict types, ratchet, and all prior passing gates offline
        shell: bash
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$IMAGE_ID"
          source="$RUNNER_TEMP/questionnaire-baseline/source"
          test -d "$source/node_modules/typescript"
          docker run --rm --network=none --read-only \
            --mount "type=bind,source=$source,target=/source,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=2g --pids-limit=256 \
            --cap-drop=ALL --security-opt=no-new-privileges --user 1000:1000 -w /source "$IMAGE" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/tmp/home TMPDIR=/tmp NODE_OPTIONS=--max-old-space-size=1536 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 /bin/bash -euo pipefail -c '
              if touch /source/.read-only-probe 2>/dev/null; then exit 1; fi
              node /source/node_modules/typescript/bin/tsc \
                --noEmit --strict --skipLibCheck --target ESNext --module ESNext --moduleResolution bundler \
                --allowImportingTsExtensions --lib ESNext,DOM \
                --typeRoots /source/node_modules/@types --types node \
                /source/extensions/ask-user-question.ts /source/lib/questionnaire/questionnaire-view.ts \
                /source/tests/ask-user-question.test.ts /source/tests/questionnaire-view.test.ts
              node /source/scripts/check-types.mjs
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="^(UM-03a-preview: long split preview remains reachable at 80x20|UM-03a: 40x20 wrapped body keeps Next, Submit, and Cancel reachable without answer-time delivery|UM-03a: scrolling and resize reject stale hits while fresh targets retain the real Editor draft|UM-03a-editor: long wrapped question keeps the real custom Editor draft and caret on screen|UM-03a-boundary: non-scrollable owned body returns boundary and zero wheel events to host)$" \
                /source/tests/questionnaire-view.test.ts | tee /tmp/um03a-green.tap
              grep -Fx "# pass 5" /tmp/um03a-green.tap
              grep -Fx "# fail 0" /tmp/um03a-green.tap
              for name in \
                "UM-03a-preview: long split preview remains reachable at 80x20" \
                "UM-03a: 40x20 wrapped body keeps Next, Submit, and Cancel reachable without answer-time delivery" \
                "UM-03a: scrolling and resize reject stale hits while fresh targets retain the real Editor draft" \
                "UM-03a-editor: long wrapped question keeps the real custom Editor draft and caret on screen" \
                "UM-03a-boundary: non-scrollable owned body returns boundary and zero wheel events to host"; do
                grep -F " - $name" /tmp/um03a-green.tap | grep -q "^ok "
              done
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="^(RPIV questionnaire blockers emit only a private, balanced Herdr projection|Herdr coordinates guarded confirmations and RPIV labels without inactive relabel pulses|closed choice blockers retain the visible choice label through guarded-confirmation overlap)$" \
                /source/tests/gentle-ai.test.ts | tee /tmp/herdr.tap
              grep -Fx "# pass 3" /tmp/herdr.tap
              grep -Fx "# fail 0" /tmp/herdr.tap
              for name in \
                "RPIV questionnaire blockers emit only a private, balanced Herdr projection" \
                "Herdr coordinates guarded confirmations and RPIV labels without inactive relabel pulses" \
                "closed choice blockers retain the visible choice label through guarded-confirmation overlap"; do
                grep -F " - $name" /tmp/herdr.tap | grep -q "^ok "
              done
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="^(UM-01: keyboard Next and final Submit require separate actions after answering|UM-01: earlier answers remain editable until explicit Submit|UM-01: an empty optional MULTI can be explicitly submitted|UM-01: custom draft and MULTI toggles survive editing before Submit|UM-01: pointer Submit accepts only the visible action hit span|UM-01: pointer Submit delivers latest MULTI selection after commit and custom edit|UM-01: visible Cancel remains distinct from Submit)$" \
                /source/tests/questionnaire-view.test.ts | tee /tmp/um01-green.tap
              grep -Fx "# pass 7" /tmp/um01-green.tap
              grep -Fx "# fail 0" /tmp/um01-green.tap
              for name in \
                "keyboard Next and final Submit require separate actions after answering" \
                "earlier answers remain editable until explicit Submit" \
                "an empty optional MULTI can be explicitly submitted" \
                "custom draft and MULTI toggles survive editing before Submit" \
                "pointer Submit accepts only the visible action hit span" \
                "pointer Submit delivers latest MULTI selection after commit and custom edit" \
                "visible Cancel remains distinct from Submit"; do
                grep -F " - UM-01: $name" /tmp/um01-green.tap | grep -q "^ok "
              done
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="^(UM-02: typed Shift-Enter newline differs from custom commit and explicit Submit|UM-02: bracketed paste normalizes CRLF CR and tabs|UM-02: large bracketed paste expands to full text at least 1100 characters|UM-02: drafts and caret remain separate across Tab Esc and reopen|UM-02: MULTI retains toggles with custom multiline text until explicit Submit|UM-02: editor pointer owns text target and restores caret position)$" \
                /source/tests/questionnaire-view.test.ts | tee /tmp/um02-green.tap
              grep -Fx "# pass 6" /tmp/um02-green.tap
              grep -Fx "# fail 0" /tmp/um02-green.tap
              for name in \
                "typed Shift-Enter newline differs from custom commit and explicit Submit" \
                "bracketed paste normalizes CRLF CR and tabs" \
                "large bracketed paste expands to full text at least 1100 characters" \
                "drafts and caret remain separate across Tab Esc and reopen" \
                "MULTI retains toggles with custom multiline text until explicit Submit" \
                "editor pointer owns text target and restores caret position"; do
                grep -F " - UM-02: $name" /tmp/um02-green.tap | grep -q "^ok "
              done
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="^(UM03b-wheel: rendered option text scrolls while same-row blank cells fall through|UM03b-wheel: oversized inline preview text scrolls while adjacent blank cells fall through|UM03b-wheel: split preview text scrolls while the gutter falls through)$" \
                /source/tests/questionnaire-view.test.ts | tee /tmp/um03b-green.tap
              grep -Fx "# pass 3" /tmp/um03b-green.tap
              grep -Fx "# fail 0" /tmp/um03b-green.tap
              for name in \
                "rendered option text scrolls while same-row blank cells fall through" \
                "oversized inline preview text scrolls while adjacent blank cells fall through" \
                "split preview text scrolls while the gutter falls through"; do
                grep -F " - UM03b-wheel: $name" /tmp/um03b-green.tap | grep -q "^ok "
              done
            '

      - name: Require all 74 ask/view tests and four exact UM-04a passes
        shell: bash
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$IMAGE_ID"
          source="$RUNNER_TEMP/questionnaire-baseline/source"
          docker run --rm --network=none --read-only \
            --mount "type=bind,source=$source,target=/source,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=2g --pids-limit=256 \
            --cap-drop=ALL --security-opt=no-new-privileges --user 1000:1000 -w /source "$IMAGE" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/tmp/home TMPDIR=/tmp NODE_OPTIONS=--max-old-space-size=1536 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 /bin/bash -euo pipefail -c '
              tap=/tmp/questionnaire-green.tap
              node --experimental-strip-types --test --test-reporter=tap \
                /source/tests/ask-user-question.test.ts /source/tests/questionnaire-view.test.ts | tee "$tap"
              for expected in "# tests 74" "# pass 74" "# fail 0" "# cancelled 0" "# skipped 0"; do
                grep -Fx "$expected" "$tap"
              done
              for name in \
                "UM-04a: Escape retains a committed option preview from the real TUI" \
                "UM-04a: Escape retains committed MULTI and custom rows in question order" \
                "UM-04a: Escape excludes uncommitted MULTI toggles and custom draft after a skipped question" \
                "UM-04a: partial cancellation renders numbered rows and keeps empty cancel shapes"; do
                test "$(grep -Ec "^ok [0-9]+ - $name$" "$tap")" -eq 1
              done
              echo "Full unfiltered ask/view TAP: 74/74 passed, exactly four named UM-04a passes, zero failures/cancellations/skips"
            '

      - name: Recheck exact checkout and cleanliness
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "final clean checkout=$EXPECTED_SHA"
