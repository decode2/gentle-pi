name: Current-upstream questionnaire UM-04b abort lifecycle RED

on:
  push:
    branches:
      - fix/questionnaire-abort-lifecycle
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  baseline:
    # Only the designated fork/upstream branch; no arbitrary PR head in the networked lane.
    if: >-
      (github.repository == 'Gentleman-Programming/gentle-shell' ||
       github.repository == 'Gentleman-Programming/gentle-pi' ||
       github.repository == 'decode2/gentle-pi') &&
      (github.event_name == 'push' ||
       (github.head_ref == 'fix/questionnaire-abort-lifecycle' &&
        (github.event.pull_request.head.repo.full_name == 'decode2/gentle-pi' ||
         github.event.pull_request.head.repo.full_name == 'Gentleman-Programming/gentle-shell' ||
         github.event.pull_request.head.repo.full_name == 'Gentleman-Programming/gentle-pi')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE: 7f78c36d4b50070008557a79b8734dd37222c569
      RED_BASE: 7fb49b4fc88f1978026d560e1cfce4be830b4932
      IMAGE: node@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4 # previously hosted-verified Node 24 image
      UM04B_VIEW_TEST_BLOB: 449e88dc9ff33958887e19f62dab18ca247daf57
      UM04B_ASK_TEST_BLOB: 86bd0fe46849888ca264c982743dbf932eda37c4
      FROZEN_VIEW_BLOB: 145fbf99ed4a31bd781fab8bf6b251d3da2cffea
      FROZEN_ASK_BLOB: 98feeddecac4f1ea0471afd84824a2c4b1b7e86e
    steps:
      - name: Checkout exact event revision without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove UM-04b RED test blobs and frozen producer/view identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git cat-file -e "$BASE^{commit}"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git cat-file -e "$RED_BASE^{commit}"
          test "$(git merge-base "$RED_BASE" HEAD)" = "$RED_BASE"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/questionnaire-current-upstream.yml|odd/tasks/questionnaire-current-upstream.md|tests/questionnaire-view.test.ts|tests/ask-user-question.test.ts) ;;
              *) echo "unexpected RED change: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$RED_BASE" HEAD)
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/questionnaire-current-upstream.yml|odd/tasks/questionnaire-current-upstream.md|tests/questionnaire-view.test.ts|tests/ask-user-question.test.ts|lib/questionnaire/questionnaire-view.ts|extensions/ask-user-question.ts) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          for path in \
            package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json \
            scripts/check-types.mjs scripts/types-baseline.json \
            extensions/gentle-ai.ts \
            lib/native-fullscreen-interaction.ts \
            tests/gentle-ai.test.ts; do
            base_blob="$(git rev-parse "$BASE:$path")"
            test "$(git rev-parse "HEAD:$path")" = "$base_blob"
            test "$(git hash-object -- "$path")" = "$base_blob"
          done
          for entry in \
            "tests/ask-user-question.test.ts:$UM04B_ASK_TEST_BLOB" \
            "tests/questionnaire-view.test.ts:$UM04B_VIEW_TEST_BLOB" \
            "lib/questionnaire/questionnaire-view.ts:$FROZEN_VIEW_BLOB" \
            "extensions/ask-user-question.ts:$FROZEN_ASK_BLOB"; do
            path="${entry%%:*}"
            blob="${entry#*:}"
            test "$(git rev-parse "HEAD:$path")" = "$blob"
            test "$(git hash-object -- "$path")" = "$blob"
          done
          echo "UM-04b RED checkout=$EXPECTED_SHA ask_test=$UM04B_ASK_TEST_BLOB view_test=$UM04B_VIEW_TEST_BLOB view=$FROZEN_VIEW_BLOB ask=$FROZEN_ASK_BLOB base=$BASE red_base=$RED_BASE other critical blobs unchanged"

      - name: Acquire pinned Node image and verify image identity
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          test "$image_id" = sha256:b795e77f6c253b171f482eff27b9b882dc4cdcb42d773372e298481c7318fbc2
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          echo "id=$image_id" >> "$GITHUB_OUTPUT"
          echo "acquisition image=$IMAGE id=$image_id"

      - name: Install independent frozen dependencies in networked acquisition artifact
        shell: bash
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$IMAGE_ID"
          artifact="$RUNNER_TEMP/questionnaire-baseline"
          test ! -e "$artifact"
          mkdir "$artifact"
          chmod 0777 "$artifact"
          docker run --rm --network=bridge --read-only \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$artifact,target=/artifact" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=2g --pids-limit=256 \
            --cap-drop=ALL --security-opt=no-new-privileges --user 1000:1000 \
            -e EXPECTED_SHA "$IMAGE" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/artifact/home TMPDIR=/artifact/tmp NPM_CONFIG_CACHE=/artifact/npm-cache \
            NPM_CONFIG_USERCONFIG=/artifact/home/user.npmrc NPM_CONFIG_GLOBALCONFIG=/artifact/home/global.npmrc \
            PNPM_HOME=/artifact/pnpm-home GIT_CONFIG_GLOBAL=/artifact/home/gitconfig GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_SYSTEM=/dev/null GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            EXPECTED_SHA="$EXPECTED_SHA" /bin/bash -euo pipefail -c '
              mkdir -p /artifact/{home,tmp,npm-cache,pnpm-home}
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /workspace/.git
              git clone --no-local --no-checkout /workspace /artifact/source
              cd /artifact/source
              git checkout --detach "$EXPECTED_SHA"
              test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
              test -z "$(git status --porcelain=v1 --untracked-files=all)"
              npm install --prefix /artifact/pnpm-bootstrap --no-save --package-lock=false \
                --ignore-scripts --no-audit --no-fund pnpm@11.1.1
              pnpm=/artifact/pnpm-bootstrap/node_modules/.bin/pnpm
              test "$("$pnpm" --version)" = 11.1.1
              "$pnpm" install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --reporter=append-only
              test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
              test -z "$(git status --porcelain=v1 --untracked-files=all)"
              echo "acquired checkout=$EXPECTED_SHA pnpm=11.1.1 frozen-lockfile=true scripts=false"
            '

      - name: Run strict types, ratchet, baseline, Herdr, prior gates and isolated RED offline
        shell: bash
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$IMAGE_ID"
          source="$RUNNER_TEMP/questionnaire-baseline/source"
          test -d "$source/node_modules/typescript"
          docker run --rm --network=none --read-only \
            --mount "type=bind,source=$source,target=/source,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=2g --pids-limit=256 \
            --cap-drop=ALL --security-opt=no-new-privileges --user 1000:1000 -w /source "$IMAGE" \
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/tmp/home TMPDIR=/tmp NODE_OPTIONS=--max-old-space-size=1536 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 /bin/bash -euo pipefail -c '
              if touch /source/.read-only-probe 2>/dev/null; then exit 1; fi
              node /source/node_modules/typescript/bin/tsc \
                --noEmit --strict --skipLibCheck --target ESNext --module ESNext --moduleResolution bundler \
                --allowImportingTsExtensions --lib ESNext,DOM \
                --typeRoots /source/node_modules/@types --types node \
                /source/extensions/ask-user-question.ts /source/lib/questionnaire/questionnaire-view.ts \
                /source/tests/ask-user-question.test.ts /source/tests/questionnaire-view.test.ts
              node /source/scripts/check-types.mjs
              node --experimental-strip-types --test --test-reporter=tap \
                --test-skip-pattern="^UM-04b:" \
                /source/tests/ask-user-question.test.ts /source/tests/questionnaire-view.test.ts \
                | tee /tmp/questionnaire-full.tap
              for expected in "TAP version 13" "# pass 70" "# fail 0" \
                "# cancelled 0" "# todo 0"; do
                grep -Fx "$expected" /tmp/questionnaire-full.tap
              done
              test "$(grep -Ec "^ok [0-9]+ - " /tmp/questionnaire-full.tap)" -ge 70
              ! grep -Fq "Invalid questionnaire:" /tmp/questionnaire-full.tap
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="RPIV questionnaire blockers|Herdr coordinates|closed choice blockers" \
                /source/tests/gentle-ai.test.ts | tee /tmp/herdr.tap
              for expected in "# tests 3" "# pass 3" "# fail 0" \
                "# cancelled 0" "# skipped 0" "# todo 0"; do
                grep -Fx "$expected" /tmp/herdr.tap
              done
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="^UM-01:" \
                /source/tests/questionnaire-view.test.ts | tee /tmp/um01-green.tap
              grep -Fx "TAP version 13" /tmp/um01-green.tap
              grep -Fx "1..7" /tmp/um01-green.tap
              grep -Fx "# tests 7" /tmp/um01-green.tap
              grep -Fx "# pass 7" /tmp/um01-green.tap
              grep -Fx "# fail 0" /tmp/um01-green.tap
              grep -Fx "# cancelled 0" /tmp/um01-green.tap
              grep -Fx "# skipped 0" /tmp/um01-green.tap
              grep -Fx "# todo 0" /tmp/um01-green.tap
              test "$(grep -Ec "^ok [0-9]+ - UM-01:" /tmp/um01-green.tap)" -eq 7
              for name in \
                "keyboard Next and final Submit require separate actions after answering" \
                "earlier answers remain editable until explicit Submit" \
                "an empty optional MULTI can be explicitly submitted" \
                "custom draft and MULTI toggles survive editing before Submit" \
                "pointer Submit accepts only the visible action hit span" \
                "pointer Submit delivers latest MULTI selection after commit and custom edit" \
                "visible Cancel remains distinct from Submit"; do
                grep -E "^ok [0-9]+ - UM-01: $name$" /tmp/um01-green.tap
              done
              grep -E "^# (tests|pass|fail|cancelled|skipped|todo) [0-9]+$" /tmp/um01-green.tap
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="^UM-02:" \
                /source/tests/questionnaire-view.test.ts | tee /tmp/um02-green.tap
              grep -Fx "TAP version 13" /tmp/um02-green.tap
              grep -Fx "1..5" /tmp/um02-green.tap
              grep -Fx "# tests 5" /tmp/um02-green.tap
              grep -Fx "# pass 5" /tmp/um02-green.tap
              grep -Fx "# fail 0" /tmp/um02-green.tap
              grep -Fx "# cancelled 0" /tmp/um02-green.tap
              grep -Fx "# skipped 0" /tmp/um02-green.tap
              grep -Fx "# todo 0" /tmp/um02-green.tap
              test "$(grep -Ec "^ok [0-9]+ - UM-02:" /tmp/um02-green.tap)" -eq 5
              for name in \
                "typed newline edits custom text without submitting it" \
                "bracketed multiline paste normalizes CRLF CR and tabs before custom commit" \
                "Tab Esc and reopen preserve separate drafts and the editing caret" \
                "MULTI custom multiline answer keeps toggles until explicit Submit"; do
                grep -E "^ok [0-9]+ - UM-02: $name$" /tmp/um02-green.tap
              done
              grep -E "^ok [0-9]+ - UM-02: large bracketed paste delivers expanded content instead of its marker$" /tmp/um02-green.tap
              grep -E "^# (tests|pass|fail|cancelled|skipped|todo) [0-9]+$" /tmp/um02-green.tap
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="^UM-03a:" \
                /source/tests/questionnaire-view.test.ts | tee /tmp/um03a-green.tap
              for expected in "TAP version 13" "1..2" "# tests 2" "# pass 2" "# fail 0" \
                "# cancelled 0" "# skipped 0" "# todo 0"; do
                grep -Fx "$expected" /tmp/um03a-green.tap
              done
              test "$(grep -Ec "^ok [0-9]+ - UM-03a:" /tmp/um03a-green.tap)" -eq 2
              grep -E "^ok [0-9]+ - UM-03a: a 40x20 long wrapped body keeps Next Submit and Cancel reachable without answer-time delivery$" /tmp/um03a-green.tap
              grep -E "^ok [0-9]+ - UM-03a: scrolling and width resize reject stale hits but fresh owned targets retain the Editor draft$" /tmp/um03a-green.tap
              grep -E "^# (tests|pass|fail|cancelled|skipped|todo) [0-9]+$" /tmp/um03a-green.tap
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="^UM-03a-editor:" \
                /source/tests/questionnaire-view.test.ts | tee /tmp/um03a-editor-green.tap
              for expected in "TAP version 13" "1..1" "# tests 1" "# pass 1" "# fail 0" \
                "# cancelled 0" "# skipped 0" "# todo 0"; do
                grep -Fx "$expected" /tmp/um03a-editor-green.tap
              done
              grep -E "^ok [0-9]+ - UM-03a-editor: long wrapped question keeps the real custom Editor draft and caret on screen$" /tmp/um03a-editor-green.tap
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="^UM-03a-preview:" \
                /source/tests/questionnaire-view.test.ts | tee /tmp/um03a-preview-green.tap
              for expected in "TAP version 13" "1..1" "# tests 1" "# pass 1" "# fail 0" \
                "# cancelled 0" "# skipped 0" "# todo 0"; do
                grep -Fx "$expected" /tmp/um03a-preview-green.tap
              done
              grep -E "^ok [0-9]+ - UM-03a-preview: long split preview remains reachable with a short left body at 80x20$" /tmp/um03a-preview-green.tap
              grep -E "^# (tests|pass|fail|cancelled|skipped|todo) [0-9]+$" /tmp/um03a-preview-green.tap
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="^UM-04a:" \
                /source/tests/ask-user-question.test.ts | tee /tmp/um04a-green.tap
              for expected in "TAP version 13" "# pass 4" "# fail 0" \
                "# cancelled 0" "# todo 0"; do
                grep -Fx "$expected" /tmp/um04a-green.tap
              done
              test "$(grep -Ec "^ok [0-9]+ - UM-04a:" /tmp/um04a-green.tap)" -eq 4
              for name in \
                "Escape preserves a committed option and preview in partial cancellation" \
                "Escape preserves committed MULTI and custom rows in question order" \
                "cancellation excludes later uncommitted MULTI toggles and custom draft" \
                "renderResult shows partial rows alongside cancellation without changing answerless rendering"; do
                grep -E "^ok [0-9]+ - UM-04a: $name$" /tmp/um04a-green.tap
              done
              ! grep -Fq "Invalid questionnaire:" /tmp/um04a-green.tap
              grep -E "^# (tests|pass|fail|cancelled|skipped|todo) [0-9]+$" /tmp/um04a-green.tap
              set +e
              node --experimental-strip-types --test --test-reporter=tap \
                --test-name-pattern="^UM-04b:" \
                /source/tests/ask-user-question.test.ts /source/tests/questionnaire-view.test.ts \
                > /tmp/um04b-red.tap 2>&1
              red_status=$?
              set -e
              test "$red_status" -ne 0
              grep -Fx "TAP version 13" /tmp/um04b-red.tap
              grep -Fx "# fail 5" /tmp/um04b-red.tap
              grep -Fx "# cancelled 0" /tmp/um04b-red.tap
              test "$(grep -Ec "^not ok [0-9]+ - UM-04b:" /tmp/um04b-red.tap)" -eq 5
              test "$(grep -Ec "^not ok [0-9]+ - " /tmp/um04b-red.tap)" -eq 5
              test "$(grep -Ec "code:.*ERR_ASSERTION" /tmp/um04b-red.tap)" -eq 5
              for name in \
                "pre-aborted valid TUI signal never mounts or emits blocked" \
                "active abort delivers committed preview once through host done and ignores late input" \
                "abort discards an uncommitted custom draft" \
                "user completion wins and abort listeners are removed on settlement and rejection" \
                "callable view cancel snapshots committed rows once and rejects late edits"; do
                grep -E "^not ok [0-9]+ - UM-04b: $name$" /tmp/um04b-red.tap
              done
              ! grep -Fq "Invalid questionnaire:" /tmp/um04b-red.tap
              grep -E "^# (tests|pass|fail|cancelled|skipped|todo) [0-9]+$" /tmp/um04b-red.tap
            '

      - name: Recheck exact checkout and cleanliness
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "final clean checkout=$EXPECTED_SHA"
