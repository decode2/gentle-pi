name: Manual native npm install smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]

permissions:
  contents: read

jobs:
  artifact-preflight:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.repo.fork == true
    name: npm install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      GH_TOKEN: ""
      NODE_AUTH_TOKEN: ""
      NPM_TOKEN: ""
    steps:
      - name: Checkout fork draft source without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Select hosted Node.js toolchain (not Gentle-Shell setup)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Run pure artifact-preflight tests only (no package install, postinstall, setup, or launcher)
        run: node --experimental-strip-types --test tests/manual-native-preflight.test.ts

      - name: Test pure official Engram staging guards (no extraction or execution)
        run: node --experimental-strip-types --test tests/manual-native-engram-stage.test.ts

      - name: Test pure official ZIP inventory probe with synthetic buffers only
        run: node --experimental-strip-types --test tests/manual-native-zip-buffer.test.ts tests/manual-native-zip-official-probe.test.ts

      - name: Test published package comparison and unverified Pi dependency bounds only
        env:
          HOME: ${{ runner.temp }}/manual-native-identity-tests/home
          USERPROFILE: ${{ runner.temp }}/manual-native-identity-tests/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/manual-native-identity-tests/xdg
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/manual-native-identity-tests/agent
          GENTLE_PI_CONFIG_HOME: ${{ runner.temp }}/manual-native-identity-tests/config
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node --experimental-strip-types --test tests/manual-native-installed-identity.test.ts

      - name: Test isolated staging guards and npm invocation
        env:
          HOME: ${{ runner.temp }}/manual-native-tests/home
          USERPROFILE: ${{ runner.temp }}/manual-native-tests/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/manual-native-tests/xdg
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/manual-native-tests/agent
          GENTLE_PI_CONFIG_HOME: ${{ runner.temp }}/manual-native-tests/config
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node --experimental-strip-types --test tests/manual-native-runtime.test.ts tests/manual-native-staging.test.ts

      - name: Prepare runner-disposable artifact scratch
        run: node scripts/manual-native-preflight.mjs prepare

      - name: Stage pinned npm archives with lifecycle scripts disabled
        shell: bash
        env:
          HOME: ${{ runner.temp }}/gentle-shell-manual-native-preflight/home
          USERPROFILE: ${{ runner.temp }}/gentle-shell-manual-native-preflight/home
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/gentle-shell-manual-native-preflight/npmrc
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/gentle-shell-manual-native-preflight/global-npmrc
          NPM_CONFIG_CACHE: ${{ runner.temp }}/gentle-shell-manual-native-preflight/npm-cache
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          if ! npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/gentle-shell-manual-native-preflight" gentle-pi@3.7.0 @earendil-works/pi-coding-agent@0.85.1 >/dev/null 2>&1; then
            printf '%s\n' 'Pinned npm artifact staging failed; lifecycle scripts were disabled.' >&2
            exit 1
          fi

      - name: Verify staged npm and official Engram release artifacts only
        run: node scripts/manual-native-preflight.mjs verify

      - name: Inventory official Windows Engram ZIP (metadata only)
        if: runner.os == 'Windows'
        run: node scripts/manual-native-zip-official-probe.mjs

      - name: Validate official Engram member (Windows memory-only; Darwin scratch stage)
        run: node scripts/manual-native-engram-stage.mjs validate

      - name: Prepare disposable npm staging directories
        run: node scripts/manual-native-staging.mjs prepare

      - name: Run isolated npm install smoke (installed bytes unverified)
        run: node scripts/manual-native-staging.mjs install

      - name: Compare published package files; nested Pi dependencies remain unverified; no postinstall/Pi execution or Ready
        timeout-minutes: 12
        run: node scripts/manual-native-installed-identity.mjs verify
