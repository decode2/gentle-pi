name: UM06b1 packed artifact provenance baseline
on:
  push:
    branches: [feat/questionnaire-current-main-packed-artifact]
permissions:
  contents: read
jobs:
  artifact-baseline:
    if: >-
      (github.repository == 'Gentleman-Programming/gentle-pi' || github.repository == 'decode2/gentle-pi') &&
      github.event_name == 'push' && github.ref == 'refs/heads/feat/questionnaire-current-main-packed-artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE: c3a12d2177196698ad2949a9bcdc927a7089b5d3
      IMAGE: node@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze event, ancestry, scope, protected blobs and total budget
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$EXPECTED_SHA" != "$BASE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          while IFS= read -r path; do
            case "$path" in
              tests/fixtures/questionnaire-packed-artifact.ts|tests/questionnaire-packed-artifact.test.ts|.github/workflows/questionnaire-packed-artifact.yml|odd/tasks/questionnaire-current-main-packed-discovery.md) ;;
              *) echo "unexpected path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          for entry in \
            extensions/ask-user-question.ts:73e493598f2e4ed568d54facbb4b624feae48155 \
            lib/agent-home.ts:085302a82d423907b1b33257704895bbfef8281d \
            lib/native-fullscreen-interaction.ts:58464b5d1d9c24653e18caa4a9a07656f0d7d568 \
            lib/questionnaire/schema.ts:13913bd6d1eac5650ca483f6ed687b4a67b5769f \
            lib/questionnaire/questionnaire-view.ts:b66717894ff9ea3922222b86a02642197fe06a58 \
            lib/questionnaire/validate.ts:5bf7d031bf9338b204cd69cbba0b197706721f2b \
            lib/rpc-host.ts:5248b2bb0821169ac7898ec8574ca961f61e1450 \
            lib/terminal-theme.ts:f62b8eb3502fd1ca70121e9dead850f5564faf14 \
            package.json:5b3ba5d4a31b5fe92b097e77e9171cac1af6718b \
            pnpm-lock.yaml:7a29976dd5ad8f488725076057388f73726870b5 \
            tests/questionnaire-sdk-registration.test.ts:4c0d34d0f03be766e25925114b19fd974ba3167b \
            .github/workflows/questionnaire-sdk-registration.yml:764c8082fc613c8a1429bde88928f40fe049c3f9 \
            bin/gentle-shell.mjs:875574e37053a2f3644e9319238b26909439f5e7 \
            lib/gentle-shell-launcher.ts:36e04eb87ebe21d39315d8be140a107e2e9b846e \
            runtime/gentle-shell-launcher.mjs:3658bec966239c4a6918fc3426ab058a8bb81a61 \
            tests/ask-user-question.test.ts:34ebf12930c0879ce1d39d43bcab3afa5f7cebdf \
            tests/questionnaire-view.test.ts:6ea13ae1857d9829c7f2ce0fb3b710f73c146386; do
            path="${entry%%:*}"; blob="${entry#*:}"
            test "$(git rev-parse "$BASE:$path")" = "$blob"
            test "$(git hash-object -- "$path")" = "$blob"
          done
          changes=$(git diff --numstat "$BASE" HEAD | awk '{n+=$1+$2} END {print n+0}')
          test "$changes" -le 400
          echo "AUTHORED ARTIFACT checkout=$EXPECTED_SHA lines=$changes"
          for path in tests/fixtures/questionnaire-packed-artifact.ts tests/questionnaire-packed-artifact.test.ts .github/workflows/questionnaire-packed-artifact.yml odd/tasks/questionnaire-current-main-packed-discovery.md; do
            test "$(git hash-object -- "$path")" = "$(git rev-parse "HEAD:$path")"
            git rev-parse "HEAD:$path"
          done
      - name: Acquire frozen dependencies and pack without scripts (not behavioral evidence)
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = sha256:b795e77f6c253b171f482eff27b9b882dc4cdcb42d773372e298481c7318fbc2
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          artifact="$RUNNER_TEMP/questionnaire-packed-artifact"
          test ! -e "$artifact"
          mkdir -m 0777 "$artifact"
          docker run --rm --network=bridge --read-only --user 1000:1000 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$artifact,target=/artifact" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=2g --pids-limit=256 \
            --cap-drop=ALL --security-opt=no-new-privileges "$IMAGE" \
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/artifact/home TMPDIR=/tmp \
            NPM_CONFIG_CACHE=/artifact/cache NPM_CONFIG_USERCONFIG=/artifact/home/user.npmrc \
            NPM_CONFIG_GLOBALCONFIG=/artifact/home/global.npmrc GIT_CONFIG_NOSYSTEM=1 \
            EXPECTED_SHA="$EXPECTED_SHA" /bin/bash -euo pipefail -c '
              mkdir /artifact/home /artifact/packed
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /workspace/.git
              git clone --no-local --no-checkout /workspace /artifact/source
              cd /artifact/source
              git checkout --detach "$EXPECTED_SHA"
              test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
              npm install --prefix /artifact/bootstrap --no-save --package-lock=false --ignore-scripts --no-audit --no-fund pnpm@11.1.1
              pnpm=/artifact/bootstrap/node_modules/.bin/pnpm
              test "$("$pnpm" --version)" = 11.1.1
              "$pnpm" install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --reporter=append-only
              test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
              test -z "$(git status --porcelain=v1 --untracked-files=all)"
              npm pack --json --ignore-scripts --pack-destination /artifact/packed > /artifact/packed/pack.json
              test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
              test -z "$(git status --porcelain=v1 --untracked-files=all)"
            '
      - name: Strict artifact types, ratchet and three named cases offline
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network=none --read-only --user 1000:1000 \
            --mount "type=bind,source=$RUNNER_TEMP/questionnaire-packed-artifact/source,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/questionnaire-packed-artifact/packed,target=/packed,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --cpus=1 --memory=2g --pids-limit=256 \
            --cap-drop=ALL --security-opt=no-new-privileges -w /source "$IMAGE" \
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp/home TMPDIR=/tmp \
            PACK_ARTIFACT_DIR=/packed NODE_OPTIONS=--max-old-space-size=1536 /bin/bash -euo pipefail -c '
              mkdir /tmp/home
              for root in /source /packed; do
                if touch "$root/.read-only-probe" 2>/dev/null; then exit 1; fi
              done
              node /source/node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck \
                --target ESNext --module ESNext --moduleResolution bundler --allowImportingTsExtensions \
                --lib ESNext,DOM --typeRoots /source/node_modules/@types --types node \
                /source/tests/fixtures/questionnaire-packed-artifact.ts /source/tests/questionnaire-packed-artifact.test.ts
              node /source/scripts/check-types.mjs | tee /tmp/types.tap
              grep -F "types: 188 recorded diagnostic(s), no regressions" /tmp/types.tap
              node --experimental-strip-types --test --test-reporter=tap tests/questionnaire-packed-artifact.test.ts | tee /tmp/artifact.tap
              test "$(grep -Ec "^ok [0-9]+ - UM06b1 artifact:" /tmp/artifact.tap)" -eq 3
              for name in \
                "npm integrity, manifest and eight frozen modules agree" \
                "altered tarball bytes reject original npm integrity" \
                "fresh corrupt, missing and symlinked module controls reject"; do
                test "$(grep -Ec "^ok [0-9]+ - UM06b1 artifact: $name$" /tmp/artifact.tap)" -eq 1
              done
              for expected in "# tests 3" "# pass 3" "# fail 0" "# cancelled 0" "# skipped 0" "# todo 0"; do
                grep -Fx "$expected" /tmp/artifact.tap
              done
            '
      - name: Recheck original and independent checkout identities and cleanliness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(GIT_OPTIONAL_LOCKS=0 git status --porcelain=v1 --untracked-files=all)"
          source="$RUNNER_TEMP/questionnaire-packed-artifact/source"
          if test -d "$source/.git"; then
            test "$(git -c safe.directory="$source" -C "$source" rev-parse HEAD)" = "$EXPECTED_SHA"
            test -z "$(GIT_OPTIONAL_LOCKS=0 git -c safe.directory="$source" -C "$source" status --porcelain=v1 --untracked-files=all)"
          fi
